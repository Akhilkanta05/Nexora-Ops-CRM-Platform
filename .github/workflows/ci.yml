name: CI / Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Verify ERP Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Test & Build
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client & Migrate Test DB
        run: |
          cd backend
          npx prisma generate
          npx prisma db push

      - name: Run Backend Core Integration & Stock Tests
        run: |
          cd backend
          npm run prisma:seed
          npx ts-node test-suite.ts

      - name: Compile Backend TypeScript
        run: |
          cd backend
          npm run build

      # Frontend Build
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend React App
        run: |
          cd frontend
          npm run build
